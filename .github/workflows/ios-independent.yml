name: iOS Independent Build

# Independent TestFlight build for the aahladky/openclaw fork using the user's
# own Apple team and bundle IDs. Does NOT run on upstream pushes — gated to the
# fork repo and the ios-independent branch (plus manual workflow_dispatch).

on:
  push:
    branches:
      - ios-independent
  workflow_dispatch:

concurrency:
  group: ios-independent-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build + upload TestFlight
    if: github.repository == 'aahladky/openclaw'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      OPENCLAW_DEVELOPMENT_TEAM: ${{ secrets.OPENCLAW_DEVELOPMENT_TEAM }}
      OPENCLAW_APP_BUNDLE_ID: ${{ secrets.OPENCLAW_APP_BUNDLE_ID }}
      OPENCLAW_SHARE_BUNDLE_ID: ${{ secrets.OPENCLAW_SHARE_BUNDLE_ID }}
      OPENCLAW_ACTIVITY_WIDGET_BUNDLE_ID: ${{ secrets.OPENCLAW_ACTIVITY_WIDGET_BUNDLE_ID }}
      OPENCLAW_WATCH_APP_BUNDLE_ID: ${{ secrets.OPENCLAW_WATCH_APP_BUNDLE_ID }}
      OPENCLAW_WATCH_EXTENSION_BUNDLE_ID: ${{ secrets.OPENCLAW_WATCH_EXTENSION_BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          ruby --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Fastlane
        run: |
          gem install fastlane --no-document
          fastlane --version

      - name: Write ASC API key to temp file
        id: asc-key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_P8:-}" ]; then
            echo "::error::ASC_KEY_P8 secret is empty"
            exit 1
          fi
          key_dir="$RUNNER_TEMP/asc-key"
          mkdir -p "$key_dir"
          chmod 700 "$key_dir"
          key_path="$key_dir/AuthKey_${ASC_KEY_ID}.p8"
          # Accept either raw PEM content or base64-encoded content
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s' "$ASC_KEY_P8" > "$key_path"
          else
            printf '%s' "$ASC_KEY_P8" | base64 --decode > "$key_path"
          fi
          chmod 600 "$key_path"
          # Sanity check: must contain PEM header
          if ! grep -q "BEGIN PRIVATE KEY" "$key_path"; then
            echo "::error::Decoded ASC key does not look like a PEM private key"
            exit 1
          fi
          echo "key_path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Set up signing keychain
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          # Use a random password — this keychain only lives for one job
          KEYCHAIN_PASS="$(openssl rand -hex 20)"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # Decode and import the Apple Distribution certificate + private key
          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$IOS_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          rm -f "$RUNNER_TEMP/cert.p12"

          # Allow codesign / xcodebuild to use the key without GUI prompts
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -k "$KEYCHAIN_PASS" \
            "$KEYCHAIN_PATH"

          # Put the temp keychain first in the search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Confirm the certificate is visible to codesign
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Run fastlane independent lane
        working-directory: apps/ios
        env:
          ASC_KEY_PATH: ${{ steps.asc-key.outputs.key_path }}
          INDEPENDENT_BUILD_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_DISABLE_COLORS: "1"
        run: fastlane ios independent

      - name: Cleanup ASC key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc-key"

      - name: Cleanup signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          # Restore the default keychain search list
          security list-keychains -d user -s login.keychain-db

      - name: Upload archive artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-independent-archive
          path: |
            apps/ios/build/independent/*.xcarchive
            apps/ios/build/independent/*.ipa
          if-no-files-found: ignore
          retention-days: 7
